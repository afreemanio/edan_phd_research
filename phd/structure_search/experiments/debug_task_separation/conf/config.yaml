# Dataset
dataset:
  name: double_mnist
  n_tasks: 2
  num_classes: 10
  input_per_task: 784
  per_pixel_normalize: true
  permute_period: 0

# Model (multilayer sparse network)
model:
  n_hidden_layers: 1
  n_hidden_max_per_layer: [100]
  # n_hidden_max_per_layer: [10]
  leaky_relu_slope: 0.01
  use_bias_feature: true
  n_hidden_init_per_layer: [2]
  # null entries mean fully connected for that edge
  init_conns_per_layer: [1569]

# Optimizer
optimizer:
  name: sgd
  sgd_lr: 1.0e-3
  adam_lr: 1.0e-4
  adamw_lr: 1.0e-3
  idbd_init_lr: 1.0e-6
  meta_learning_rate: 1.0e-3
  weight_decay: 0.0

# Structure tracker
structure_tracker:
  max_conns: 1569              # input connections per unit (input→h0)
  connection_budget: 6500
  connection_budget_per_layer: null   # e.g. [2000, 1000, 182]; null = use global budget
  prune_per_block: 129         # connections to prune each block
  prune_rate: 0.01             # EMA accumulation rate for prune threshold
  decay_rate: 0.999            # EMA decay for utility tracking
  max_new_units_per_step: 20000
  prune_frequency: 500         # steps between prune+generate (= block_size)
  generate_strategy: full      # 'full', 'random_sparse', or 'no_generate'
  skip_last_cull: true
  gen_units_per_layer: [100]
  gen_conns_per_layer: [1569]
  fc_isolated: false

# Training
train:
  total_steps: 500000
  # log_freq: 10000
  log_freq: 5000
  log_mode: interval       # 'interval': every log_freq steps; 'block': every block boundary

# Utility
utility:
  mode: contribution           # 'contribution', 'propagated', 'fractional_propagated', 'edan_cross_entropy'
  aux_hebbian_mode: none       # 'none' or 'post_activation'
  cull_utility_mode: original  # 'original', 'hebbian', 'product', 'sum'

# Experiment tracking
mlflow: true
mlflow_tracking_uri: "http://localhost:5000"
mlflow_experiment_name: "multilayer_singlelayertest_april_29"
mlflow_run_name: ""

# Logging
per_unit_log_max_units: 0

# Seed sweep
seed: 6969             # single-run fallback seed (used when seeds list is empty)
# seeds: [6969]          # list of seeds for preset sweep
seeds: [1, 2, 3, 4, 5]          # list of seeds for preset sweep

# Preset sweep
# Available presets: DENSE, TASKWISE-DENSE, SPARSE, CUSTOM
# CUSTOM uses the pruner+generator with config settings; optionally borrows init
# from a named baseline via custom_init_from.
run_presets:
  # - DENSE
  # - TASKWISE-DENSE
  # - SPARSE
  - CUSTOM
custom_init_from: "DENSE"   # set to DENSE / TASKWISE-DENSE / SPARSE to seed CUSTOM from there

# Hyperparameter sweep (optional — run lr_sweep.py separately before the main run)
# After lr_sweep.py finishes, set study_name below to auto-load the best LR.
sweep:
  # name: ""                  # suffix for the study name, e.g. "custom" or "dense_sparse"; empty = no suffix
  name: "v1"                  # suffix for the study name, e.g. "custom" or "dense_sparse"; empty = no suffix
  n_sweep_seeds: 1          # seeds used during LR sweep (fewer than main run)
  # n_sweep_seeds: 3          # seeds used during LR sweep (fewer than main run)
  sweep_seed_base: 100      # first seed for sweep; avoids overlap with main seeds
  # lr_grid:                  # LR values to try (log-spaced powers of 2)
    # - 9.77e-4   # 2^-10
    # - 3.91e-3   # 2^-8
    # - 1.56e-2   # 2^-6
    # - 6.25e-2   # 2^-4
    # - 2.50e-1   # 2^-2
  lr_grid:
    # - 1.00e+0   # 10^0.0
    - 3.16e-1   # 10^-0.5
    - 1.00e-1   # 10^-1.0
    - 3.16e-2   # 10^-1.5
    - 1.00e-2   # 10^-2.0
    - 3.16e-3   # 10^-2.5
    - 1.00e-3   # 10^-3.0
    - 3.16e-4   # 10^-3.5
    # - 1.00e-4   # 10^-4.0
    # - 3.16e-5   # 10^-4.5
    # - 1.00e-5   # 10^-5.0
    # - 3.16e-6   # 10^-5.5
    # - 1.00e-6   # 10^-6.0
    # - 3.16e-7   # 10^-6.5
    # - 1.00e-7   # 10^-7.0
  # study_name: "test1-april29-1"            # Optuna study to load best LR from; empty = disabled
  study_name: "test1-april29-2"            # Optuna study to load best LR from; empty = disabled
