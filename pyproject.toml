[project]
authors = [{name = "Andrew Freeman", email = "andrew@afreeman.io"}]
dependencies = []
name = "phd"
requires-python = ">= 3.11"
version = "0.1.0"
dynamic = ["scripts", "classifiers", "readme"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]

[tool.pixi.feature.base.pypi-dependencies]
phd = { path = ".", editable = true }
# edan_phd_research = { path = ".", editable = true }

