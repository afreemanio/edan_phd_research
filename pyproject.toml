# ----------------------
# Torch: CPU feature
# ----------------------
[tool.pixi.feature.torch_cpu.dependencies]
pytorch-cpu = "*"
torchvision = "*"

# ----------------------
# Torch: GPU feature
# Windows + Linux only
# ----------------------
[tool.pixi.feature.torch_gpu]
platforms = ["win-64", "linux-64"]

[tool.pixi.feature.torch_gpu.system-requirements]
cuda = "13.0"

[tool.pixi.feature.torch_gpu.dependencies]
pytorch-gpu = "*"
torchvision = "*"

# ----------------------
# JAX: CPU feature
# ----------------------
[tool.pixi.feature.jax_cpu.pypi-dependencies]
jax = "*"
jaxlib = "*"

# ----------------------
# JAX: GPU feature
# macOS + Linux only
# ----------------------
[tool.pixi.feature.jax_gpu]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.feature.jax_gpu.dependencies]
jax = "0.9.*"

# Install JAX with CUDA 12 support on Linux.
# We explicitly list jax-cuda12-plugin because pixi resolves jax from conda-forge
# (hash-mapping), which ignores pip extras like jax[cuda12].
# Version must match the conda jax pin above.
[tool.pixi.feature.jax_gpu.target.linux-64.pypi-dependencies]
jax-cuda12-plugin = { version = ">=0.9.0,<0.10", extras = ["with-cuda"] }

# ----------------------
# Environments
# ----------------------
[tool.pixi.environments]
default   = { features = ["base", "torch_cpu", "jax_cpu"], no-default-feature = true }
torch-gpu = { features = ["base", "torch_gpu", "jax_cpu"], no-default-feature = true }
jax-gpu   = { features = ["base", "torch_cpu", "jax_gpu"], no-default-feature = true }
both-gpu  = { features = ["base", "torch_gpu", "jax_gpu"], no-default-feature = true }

[dependency-groups]
base = ["comet-ml>=3.31.11,<4", "semantic-version>=2.10.0,<3", "stack-data"]
